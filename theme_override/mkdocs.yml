site_name: Template Operator v2
docs_dir: content
site_url: https://docs.stakater.com/template-operator-v2-docs/
repo_url: https://github.com/stakater/template-operator-v2-docs
edit_uri: blob/main/content/
theme:
  favicon: assets/images/favicon.svg

strict: true
validation:
  links:
    anchors: warn

extra:
  version:
    provider: mike
    default: latest

nav:
